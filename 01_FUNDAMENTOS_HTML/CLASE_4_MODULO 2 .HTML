<!DOCTYPE html>
<!--Los comentarios dentro de HTML se colocan entre las etiquetas de la manera siguiente: "<!--" y "-->" 
   <!-- Autor: Ernesto Enrique Molina Lopez
    Fecha: 12/06/2024
    Descripción: En este documento se practican las etiquetas de listas desordenadas, ordenadas y de definición. -- >
-->
    <html lang="es"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCUMENTO PARA PRACTICA 
    </title>
    <title> PRACTICA - TEXTO </title>
</head>
<body>
    <h1>PRACTICA - TEXTO</h1>

    <!--VEREMOS LA ETIQUETA <UL>   </UL> -->
    <h1>LISTA DESORDENADA</h1>
    <ul> <!--sirve para crear una lista desordenada-->
        <!--Se coloca la etiqueta <li></li> para cada elemento de la lista-->

        <li>Elemeto 1</li>
        <li>Elemeto 2</li>
        <li>Elemeto 3</li>
        <!--Se cierra la etiqueta <ul> al finalizar la lista-->
    </ul>

    <!--VEREMOS LA ETIQUETA <OL>   </OL> -->
    <h1>LISTA ORDENADA</h1>
    <ol> <!--sirve para crear una lista ordenada -->
        <!--Se coloca la etiqueta <li></li> para cada elemento de la lista y se cierra la etiqueta <ol> al finalizar la lista-->
        <li> Elemento 1 </li>
        <li> Elemento 2 </li>
        <li> Elemento 3 </li>
    </ol>
<!-- Se utiliza start="4" para comenzar la lista en el número 4 cuando deba de cortar la lista e iniciar de nuevo  -->
<!--Utilizaremos <a href="..."> para crear enlaces -->
    <a href="Mi sitio" </a> 
    <!-- Entonces, utilizamos el enlace al que nos queremos dirigir para indexar el texto -->
     <a href="https://google.com" target="_blank" >Google   </a>
        <!--El atributo target="_blank" se utiliza para abrir el enlace en una nueva pestaña del navegador.-->

        <!-- Segundo enlace -->
        <a href="mailto: info@ejemplo.com?Subjet=Consulta&body= Hola, tengo una consulta sobre sus servicios." >Enviar correo</a>"
        <!-- El atributo href="mailto:..." se utiliza para crear un enlace de contacto  -->
        
        <!-- tercer enlace -->
         <a href="tel 72727272" >Llamar a servicio al cliente </a>
            <!-- El atributo href="tel:..." se utiliza para crear un enlace de llamada telefónica -->
             
</body>
</html>
